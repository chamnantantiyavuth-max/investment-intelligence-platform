card_id: ORG-2026-0016
title: "Radar: London silver vaults climb to 907.059 Moz in July 2026 — a ~5-year high and new high for the 2023+ upswing — during silver's +11% week, extending the 'no visible scarcity' series (0006→0009→0013)"
research_question: "Does the July 2026 LBMA London vault print — silver 907.059 Moz, the highest since the 2021 era and a new high for the 2023+ upswing, +16.6% YoY — landing during silver's sharpest weekly rally of the recovery leg (~+11%, to ~$64) further disconfirm the physical-liquidity-squeeze re-pricing (0006/0009/0013 convergence — 'no visible scarcity signal as of 7 Aug'), and if so, what does that imply for the composition of the rally (positioning / reflation beta vs physical demand) and for the standing inventory-liquidity watch items (COMEX deliverable stocks, lease rates, available-stock vs gross-custody evidence)?"
