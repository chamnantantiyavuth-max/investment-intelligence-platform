radar_observation: "Q3 FY26 (ended 2026-06-27, published 2026-07-30): Services net sales $30.739B, Services cost of sales $7.494B (vs $27.423B/$6.698B in Q3 FY25). Apple disclosed total-company GM 50.1% incl. ~2pp favorable tariff-refund effect; diluted EPS $2.02 incl. $0.11 tariff-refund effect. The consolidated statements do not separately label a Services GM percentage — the disclosed lines provide the inputs for independent derivation. NOTE: (30.739-7.494)/30.739 derives ≈75.62% — matching the Services GM figure flagged as 'not source-cleared' in the CRO buyback-mask dissent cover note (reports/apple-buyback-mask-test-opposing-2026-08-06.md); verification is arithmetic, interpretation needs tariff/category-level caveats."
