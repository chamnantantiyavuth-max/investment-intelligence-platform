title: "Radar: JNJ files three 8-Ks in five trading days — proposed talc-litigation resolution, Firefly Bio acquisition, and officer change + notes offering"
research_question: Does JNJ's 8-K cluster (28 Jul–4 Aug 2026) signal a deliberate cleanup of the multi-decade talc-litigation overhang — what are the terms and timing of the proposed ovarian-talc resolution, what contingent liability remains (ovarian + non-ovarian talc, bankruptcy-claims channels), and does the Firefly Bio acquisition + notes issuance change the capital-deployment read on JNJ's fundamental picture?
