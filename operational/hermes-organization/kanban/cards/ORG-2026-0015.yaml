radar_observation: "JNJ filed THREE 8-Ks in five trading days (first EDGAR filing-scan pass of the FO universe, 2026-08-07): (1) 8-K 2026-07-28 (accession 0000200406-26-000155): 'Johnson & Johnson Announces a Proposed Resolution of Ovarian Talc Litigation' — follows a favorable MDL court causation ruling; company calls it an 'efficient conclusion to the talc litigation' (EX-99.1). (2) 8-K 2026-07-29 (0000200406-26-000163): completed acquisition of Firefly Bio, Inc. — oncology biotech, pan-KRAS degraders, 'next-generation oncology innovation' (EX-99.1). (3) 8-K 2026-08-04 (0000200406-26-000167): Item 5.02 (officer departure/appointment) + Item 9.01 + multi-tranche notes offering (A-1.150% Notes due 2028 … 3.350% Notes due 2036). Cluster intensity (3 material 8-Ks in 5 trading days) is unusual for JNJ; the talc item is the highest-materiality development — a proposed resolution of the multi-decade talc-litigation overhang. Raises, does not answer: resolution terms/timing, residual non-ovarian/other-channel exposure, and whether this is a one-off or part of a broader legal cleanup. 13F context: JNJ also filed 13F-HR 2026-08-06 (Q2 season, due 14 Aug)."
radar_source: "SEC EDGAR submissions API https://data.sec.gov/submissions/CIK0000200406.json + filing index.json for accessions 0000200406-26-000155 / -000163 / -000167 (all pulled 2026-08-07; primary docs jnj-20260727.htm / jnj-20260729.htm / jnj-20260804.htm — item numbers + EX-99.1 snippets read from the raw filings)"
