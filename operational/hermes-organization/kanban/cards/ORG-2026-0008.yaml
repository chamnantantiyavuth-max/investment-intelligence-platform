radar_observation: "FOMC 2026-07-29 held fed funds 3.50-3.75% by 9-3 vote (all 3 dissents preferred +25bp hike). 2y/10y/10y-real yields 2026-08-04: 4.20%/4.63%/2.40% — up 73/45/47bp since 2025-12-31. Yet LBMA gold PM $4,206.60/oz 2026-08-05 (+24.6% YoY) while Fed broad dollar only -1.7% YoY; June CPI/core 3.46%/2.57% YoY. Gold resilience alongside higher real yields + hawkish vote = possible changing transmission mechanism."
