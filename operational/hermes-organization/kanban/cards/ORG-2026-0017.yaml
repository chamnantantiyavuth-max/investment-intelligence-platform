radar_observation: "SEC EDGAR GOOGL (CIK 0001652044) filings 8/6–8/7 2026 (pulled 2026-08-10): (1) 424B2 (accession 0001193125-26-340264, filed 8/7) prices $25,000,000,000 of notes in TEN tranches — $750M FRN 2028, $1.25B 4.500% 2028, $500M FRN 2029, $2.0B 4.625% 2029, $3.5B 4.875% 2031, $2.5B 5.200% 2033, $4.5B 5.450% 2036, $3.0B 6.250% 2046, $4.5B 6.375% 2056, $2.5B 6.500% 2066 — trade date 8/6, settlement T+2 = 8/10, Moody's Aa2 (Stable) / S&P AA+ (Stable), 15 joint book-runners; (2) FWP pricing term sheet (0001193125-26-338750, 8/7); (3) 424B5 (0001193125-26-336853, 8/6) amends the Equity Distribution Agreement for the 'up to $40,000,000,000' Class A/Class C at-the-market program (prospectus dated 6/1/2026) adding 13 managers (BofA, Citi, Deutsche, HSBC, Wells Fargo, Barclays, BNP, BTIG, Credit Agricole, Mizuho, RBC, SG, TD) alongside Goldman/JPM/MS; (4) 424B5 (0001193125-26-336798, 8/6) = preliminary prospectus supplement for the notes deal. Combined: ~$65B of issuance capacity activated within ~2 months by a mega-cap with a large cash balance — the $40B ATM EQUITY program is the unusual part for Alphabet (equity issuance is dilutive; Alphabet has historically funded via debt/cash); the long-end coupons (6.250–6.500% on 2046–2066 tenors) lock in ~1.6–1.8pp over the 10y UST (4.66%, 8/7 close) at a moment when the Fed is debating a September hike (post-jobs-miss odds tumbled 8/7). Whether any ATM shares have actually been sold is NOT visible in these filings (drawdowns appear in the 10-Q; Q2 10-Q filed 7/23 — routine). Raises, does not answer: the purpose of the combined raise (AI-capex funding scale vs M&A vs buyback pre-funding), the capital-structure signal, and whether a $40B equity ATM at a mega-cap with ~$100B+ cash is a canary for AI-capex funding strain."
