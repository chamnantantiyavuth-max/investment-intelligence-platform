title: "Radar: Alphabet activates ~$65B of capital-raising capacity in ~2 months — $25B 10-tranche IG debt priced 6 Aug (settling 10 Aug) + $40B ATM equity distribution program (syndicate expanded 6 Aug)"
research_question: "Why is Alphabet (Aa2/AA+, large cash balance, record FCF) pricing a $25B 10-tranche investment-grade bond deal (trade 6 Aug, settle 10 Aug, coupons to 6.50% on the 2066s) while maintaining a $40B at-the-market EQUITY distribution program (prospectus 1 Jun 2026, Reg 333-296395) — what is the combined ~$65B of issuance capacity being raised for (AI-capex funding vs M&A vs buyback pre-funding vs opportunistic lock-in of long-dated rates), has any of the ATM been drawn (visible only in the next 10-Q), and does this change the capital-structure / capex-funding read on an FO-universe mega-cap that has historically favored debt over equity issuance?"
