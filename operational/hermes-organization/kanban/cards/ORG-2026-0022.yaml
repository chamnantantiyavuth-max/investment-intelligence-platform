card_id: ORG-2026-0022
title: "Radar: WTI +10.7% in five sessions on the Hormuz standoff (75.22 on 8/5 → 83.27 on 8/12) while the US administration claims Gulf flows 'recovered to 15M bbl/day' and simultaneously warns of disruptions into 2027 — price vs physical-flows conflict"
research_question: "WTI (CL=F) has risen ~+10.7% in five sessions (75.22 on 8/5 → 83.27 on 8/12, 82.96 on 8/13) on the Hormuz standoff — the strongest leg since the standoff began — while the same US administration claims Gulf oil flows have 'recovered to 15M barrels a day' (gCaptain, 8/11) and separately warns to 'brace for oil supply disruptions into 2027' (Boston Herald, 8/11); Bloomberg (8/13) argues 'for the oil market, the Strait of Hormuz isn't closed'. Is the oil risk premium pricing a real, persistent supply loss (and at what order of magnitude), or is the move narrative/positioning-driven against largely-normalized physical flows? And does the resolution of that question change the inflation/rate backdrop feeding the gold (ORG-2026-0012) and silver (ORG-2026-0016) reflation stories?"
