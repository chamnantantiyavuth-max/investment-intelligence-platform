radar_observation: "WTI (CL=F, Yahoo daily closes): 75.22 (8/5) → 78.18 (8/7) → 82.13 (8/10) → 83.27 (8/12) → 82.96 (8/13) — +10.7% off the 8/5 low in five sessions, +5.5% vs the Monday-digest figure (78.71 @8/10), highest of the standoff; Brent >$82 since 8/7 per the mid-week 8/7 note. Concurrent conflicting claims, all dated: US administration 'Gulf oil flows recover to 15 million barrels a day' (gCaptain, 2026-08-11); 'Brace for oil supply disruptions into 2027, U.S. says' (Boston Herald, 2026-08-11); 'Oil Prices Climb on Stalemate in Strait of Hormuz' (NYT, 2026-08-09); 'For the Oil Market, the Strait of Hormuz Isn't Closed' (Bloomberg, 2026-08-13); Iran seeking 'polluter pays' rule + oil slick at Qeshm (WION, 2026-08-13); Gulf states building Hormuz bypass capacity (NYT/DW, 2026-08-12). Context, to verify not asserted: pre-standoff Hormuz throughput is commonly cited at ~20M bbl/day — a 'recovered 15M bbl/day' claim would still imply a material shortfall if accurate. THE OBSERVATION: an unusual ~11% weekly move (workflow §4 'material commodity supply disruption' + 'unusual volatility' trigger) sitting on top of directly conflicting official-market claims about physical flows — a verifiable price-vs-reality divergence question, distinct from 0012's gold-driver question and 0016's silver-inventory question. Raises, does not answer: whether the market is pricing a persistent supply loss, and what that implies for the inflation/rate narrative."
